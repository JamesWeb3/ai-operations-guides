---
layout: default
---
<article>
{{ content }}
</article>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": {{ page.title | jsonify }},
  "description": {{ page.description | jsonify }},
  "url": {{ page.url | absolute_url | jsonify }},
  "mainEntityOfPage": {{ page.url | absolute_url | jsonify }},
  "inLanguage": "en-NZ",
  {% if page.date %}"datePublished": {{ page.date | date_to_xmlschema | jsonify }},{% endif %}
  {% if page.last_modified_at %}"dateModified": {{ page.last_modified_at | date_to_xmlschema | jsonify }},{% elsif page.date %}"dateModified": {{ page.date | date_to_xmlschema | jsonify }},{% endif %}
  "author": {
    "@type": "Organization",
    "name": "Sentry AI",
    "alternateName": ["Sentry Solutions", "Sentry AI Solutions Limited"],
    "url": "https://sentrysolutions.ai",
    "sameAs": ["https://www.linkedin.com/company/sentrysolutions-ai", "https://x.com/sentryai_", "https://www.crunchbase.com/organization/sentry-ai"]
  },
  "publisher": {
    "@type": "Organization",
    "name": "Sentry AI",
    "url": "https://sentrysolutions.ai",
    "logo": { "@type": "ImageObject", "url": "https://sentrysolutions.ai/logo_dark.png" }
  },
  "isPartOf": { "@type": "WebSite", "name": {{ site.title | jsonify }}, "url": {{ '/' | absolute_url | jsonify }} }
}
</script>
